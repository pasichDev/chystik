name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # eframe needs the GTK stack to link, even for `cargo test`.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The whole point of this job. chystik deletes files; a rule that
      # disagrees with the safety guard must never reach main.
      - name: Tests
        run: cargo test --workspace

      - name: Release build
        run: cargo build --workspace --release

  icon:
    name: icon assets are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-render and diff
        run: |
          python3 packaging/render-icon.py
          git diff --exit-code --stat -- assets/ \
            || { echo "::error::assets/ is stale — run packaging/render-icon.py"; exit 1; }
