name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # eframe needs the GTK stack to link, even for `cargo test`.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev

      - name: Formatting
        run: cargo fmt --all --check

      - name: Version and changelog contract
        run: |
          bash packaging/linux/tests/version-contract.sh
          bash packaging/linux/tests/release-notes.sh

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The whole point of this job. chystik deletes files; a rule that
      # disagrees with the safety guard must never reach main.
      - name: Tests
        run: cargo test --workspace

      - name: Native Linux Trash smoke
        run: |
          mkdir -p "$RUNNER_TEMP/chystik-trash-data"
          XDG_DATA_HOME="$RUNNER_TEMP/chystik-trash-data" \
            cargo test -p chystik-core --test native_trash -- --ignored --exact

  platform-compile:
    name: native platform · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            native_trash: true
          - name: Windows x64
            runner: windows-2022
            native_trash: true
          - name: Windows 11 ARM64
            runner: windows-11-arm
            native_trash: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      # Compile target-selected adapters and every test/example source on
      # their native host. The native Trash integration test queries the
      # desktop trash store instead of only checking a missing source path.
      - name: Compile all targets
        run: cargo check --workspace --all-targets

      - name: Core safety tests
        run: cargo test -p chystik-core --lib

      - name: Native Trash / Recycle Bin smoke
        if: matrix.native_trash
        run: cargo test -p chystik-core --test native_trash -- --ignored --exact

  linux-packages:
    name: Linux packages and launch smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Package build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cpio desktop-file-utils file libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libwayland-dev patchelf pkg-config rpm xvfb zsync

      - name: Package script contracts
        run: |
          bash packaging/linux/tests/stage-layout.sh
          PACKAGING_TEST_RPM=1 bash packaging/linux/tests/native-packages.sh
          bash packaging/linux/tests/appimage-builder.sh
          bash packaging/linux/tests/arch-metadata.sh

      - name: Build Linux packages for smoke tests
        run: |
          mkdir -p "$RUNNER_TEMP/chystik-dist"
          DIST_DIR="$RUNNER_TEMP/chystik-dist" bash packaging/linux/build-deb.sh
          DIST_DIR="$RUNNER_TEMP/chystik-dist" bash packaging/linux/build-rpm.sh
          DIST_DIR="$RUNNER_TEMP/chystik-dist" bash packaging/linux/build-appimage.sh
          (cd "$RUNNER_TEMP/chystik-dist" && sha256sum -c ./*.sha256)

      - name: Smoke packaged binaries
        run: |
          mkdir -p "$RUNNER_TEMP/chystik-extracted/deb" "$RUNNER_TEMP/chystik-extracted/rpm"
          dpkg-deb -x "$RUNNER_TEMP/chystik-dist"/*.deb "$RUNNER_TEMP/chystik-extracted/deb"
          rpm2cpio "$RUNNER_TEMP/chystik-dist"/*.rpm | (cd "$RUNNER_TEMP/chystik-extracted/rpm" && cpio -idm)
          bash packaging/linux/smoke-launch.sh "$RUNNER_TEMP/chystik-extracted/deb/usr/bin/chystik-gui"
          bash packaging/linux/smoke-launch.sh "$RUNNER_TEMP/chystik-extracted/rpm/usr/bin/chystik-gui"
          bash packaging/linux/smoke-launch.sh "$RUNNER_TEMP/chystik-dist"/*.AppImage

  linux-runtime:
    name: Linux runtime dependencies · ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora
            image: fedora:41
            setup: dnf -y install cargo rust gcc git gtk3-devel libxkbcommon-x11 pkgconf-pkg-config
            runtime_check: rpm -q --quiet libxkbcommon-x11
          - name: Arch
            image: archlinux:latest
            setup: pacman -Syu --noconfirm --needed base-devel git gtk3 libx11 libxkbcommon libxkbcommon-x11 mesa pkgconf rust
            runtime_check: pacman -Q --quiet libxkbcommon-x11
    steps:
      - uses: actions/checkout@v4

      - name: Compile against target runtime libraries
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src" \
            --workdir /src \
            "${{ matrix.image }}" \
            /bin/bash -ceu '${{ matrix.setup }}
              cargo build --release --locked --package chystik-gui
              ${{ matrix.runtime_check }}'

  icon:
    name: icon assets are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Compares PIXELS, not file bytes: zlib output differs between
      # versions, so diffing the committed PNGs failed here for images that
      # were byte-for-byte different and pixel-for-pixel identical.
      - name: Verify assets match the renderer
        run: python3 packaging/render-icon.py --check
