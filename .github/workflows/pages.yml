name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-site.sh'
      - 'Cargo.toml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: check · package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site from the Cargo workspace version
        run: bash scripts/build-site.sh "$RUNNER_TEMP/site"

      - name: Validate generated site and version contract
        run: bash site/tests/site-contract.sh

      - name: Check every referenced local asset exists
        run: |
          set -euo pipefail
          # Local src/href targets only: skip absolute URLs and in-page anchors.
          grep -ohE '(src|href)="[^"#][^"]*"' "$RUNNER_TEMP/site"/*.html \
            | sed -E 's/^[a-z]+="//; s/"$//' \
            | { grep -vE '^(https?:)?//' || true; } \
            | sort -u > "$RUNNER_TEMP/refs.txt"
          status=0
          while read -r ref; do
            [ -n "$ref" ] || continue
            if [ ! -f "$RUNNER_TEMP/site/$ref" ]; then
              echo "::error file=site/index.html::missing generated local asset: $ref"
              status=1
            fi
          done < "$RUNNER_TEMP/refs.txt"
          exit "$status"

      - name: Reject an accidentally staged screenshot drift
        run: |
          set -euo pipefail
          # The page and the README must show the same application screenshot.
          cmp site/assets/screenshot-gui.png docs/img/screenshot-gui.png

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
