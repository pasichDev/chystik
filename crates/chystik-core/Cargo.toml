[package]
name = "chystik-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Scanner, category rules and severity engine for Chystik disk cleanup"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
jwalk = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
trash = { workspace = true }
toml = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }
windows = { version = "0.56", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }

[build-dependencies]
chrono = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
