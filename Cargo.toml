[workspace]
resolver = "2"
members = [
    "crates/chystik-core",
    "crates/chystik-cli",
    "crates/chystik-gui",
]

[workspace.package]
version = "0.2.4"
edition = "2021"
license = "MIT"
authors = ["pasichDev"]
repository = "https://github.com/pasichDev/chystik"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
jwalk = "0.8"
trash = "5"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.6"
ctrlc = { version = "3.5.2", features = ["termination"] }
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm"] }
proptest = "=1.6.0"
toml = "0.8"
