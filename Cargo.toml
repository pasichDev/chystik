[workspace]
resolver = "2"
members = [
    "crates/chystik-core",
    "crates/chystik-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["pasichDev"]
repository = "https://github.com/pasichDev/chystik"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
jwalk = "0.8"
trash = "5"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
